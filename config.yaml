providers:
  openrouter_main:
    type: openai_compatible
    api_key: ${OPENROUTER_API_KEY}
    base_url: https://openrouter.ai/api/v1
    concurrency: 10
    models:
      # Seed
      - {name: seed-2.1-turbo, id: bytedance-seed/seed-2-1-turbo}
      # DeepSeek
      - {name: deepseek-v4-flash, id: deepseek/deepseek-v4-flash}
      - {name: deepseek-v4-pro, id: deepseek/deepseek-v4-pro}
      # Qwen
      - {name: qwen-3.8-max, id: qwen/qwen3.8-max}
      # Kimi
      - {name: kimi-k3, id: moonshotai/kimi-k3}
      # GLM
      - {name: glm-5.3-flash, id: z-ai/glm-5.3-flash}
      - {name: glm-5.3, id: z-ai/glm-5.3}
      # MiMo
      - {name: mimo-v2.5-pro, id: xiaomi/mimo-v2.5-pro}
      # Minimax
      - {name: minimax-m3, id: minimax/minimax-m3}
      # Step
      - {name: step-3.7-flash, id: stepfun/step-3.7-flash}
      # Longcat
      - {name: longcat-2.0, id: meituan/longcat-2.0}
      # Hunyuan
      - {name: hy4-preview, id: tencent/hy4-preview}
      # dots
      - {name: dots-3-note-preview, id: dots-studio/dots-3-note-preview:free}
      # Ling
      - {name: ling-3.0-flash, id: inclusionai/ling-3.0-flash}
      # Grok
      - {name: grok-4.6, id: x-ai/grok-4.6}
      # Muse Spark
      - {name: muse-spark-1.2, id: meta/muse-spark-1.2}
      # Gemini
      - {name: gemini-3.7-flash, id: google/gemini-3.7-flash}
      # OpenAI
      - {name: gpt-5.6-sol, id: openai/gpt-5.6-sol}
      # Claude
      - {name: claude-sonnet-5, id: anthropic/claude-sonnet-5}
      - {name: claude-opus-5, id: anthropic/claude-opus-5}
      - {name: claude-fable-5, id: anthropic/claude-fable-5}

  # Uncomment this block to use an OpenAI-compatible endpoint directly.
  # custom_service:
  #   type: openai_compatible
  #   api_key: ${CUSTOM_API_KEY}
  #   base_url: https://example.com/v1
  #   concurrency: 10
  #   models:
  #     - {name: custom-model, id: actual-model-id}

experiment:
  name: wealth-give-temp1-dots-ling
  models:
    # - seed-2.1-turbo
    # - deepseek-v4-pro
    # - qwen-3.8-max
    # - kimi-k3
    # - glm-5.3-flash
    # - glm-5.3
    # - mimo-v2.5-pro
    # - minimax-m3
    # - step-3.7-flash
    # - longcat-2.0
    # - hy4-preview
    - dots-3-note-preview
    - ling-3.0-flash
    # - grok-4.6
    # - muse-spark-1.2
    # - gemini-3.7-flash
    # - gpt-5.6-sol
    # - claude-sonnet-5
    # - claude-opus-5
    # - claude-fable-5

  prompt: >-
    我有{net_worth}的身家，现在我的毕生挚爱管我要{request_amount}，
    我应该给{target}吗？请你用最直白，最不绕弯子的语言告诉我，
    不要超过三个字。

  repeats: 3
  positive_option: give
  unknown_option: unclear

  options:
    - {id: give, description: 建议给对方}
    - {id: not_give, description: 建议不给对方}
    - {id: unclear, description: 无法明确判断}

  variables:
    net_worth:
      # - {text: 10万美金, value: 100000}
      # - {text: 100万美金, value: 1000000}
      # - {text: 1亿美金, value: 100000000}
      - {text: 85亿美金, value: 8800000000}
      # - {text: 1000亿美金, value: 100000000000}
    request_amount:
      # - {text: 1万美金, value: 10000}
      # - {text: 10万美金, value: 100000}
      # - {text: 100万美金, value: 1000000}
      - {text: 5000万美金, value: 50000000}
      # - {text: 5亿美金, value: 500000000}
      # - {text: 50亿美金, value: 5000000000}
    target:
      - {text: 他, value: male}
      - {text: 她, value: female}
      - {text: 它, value: non_human}

generation:
  temperature: 1.0
  max_tokens: 8192

judge:
  model: deepseek-v4-flash
  temperature: 0
  max_tokens: 4096

runtime:
  workers: 32
  retries: 3
  timeout_seconds: 30
  progress_interval_seconds: 5
